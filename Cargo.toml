[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/hal-adapter",
    "crates/pico-app",
    "crates/pico-embassy",
    "crates/tests",
]

[workspace.dependencies]
embedded-hal = "0.2.7"
embedded-hal-async = "1.0"

# Embassy — pinned to compatible crates.io versions
# NOTE: defmt disabled on embassy crates due to version conflict
# embassy-rp defmt feature pulls in embassy-usb-driver which uses defmt 1.x
# but rest of ecosystem uses defmt 0.3. Re-enable when embassy releases consistent versions.
embassy-rp = { version = "0.2", features = ["unstable-pac", "time-driver", "critical-section-impl"] }
embassy-time = { version = "0.3" }
embassy-executor = { version = "0.5", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-sync = "0.5"
embassy-usb = { version = "0.3" }
embassy-futures = "0.1"
embassy-time-driver = "0.1"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
fugit = "0.3.7"
cortex-m = "0.7"
cortex-m-rt = "0.7"
heapless = "0.8"
static_cell = "2"
portable-atomic = { version = "1.6", features = ["critical-section"] }

[profile.release]
debug = 2
lto = true
opt-level = "z"
